<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  @if (errorMessage) {
    <p class="modal-error">{{ errorMessage }}</p>
  }
  <app-form-generator
    [config]="formConfig"
    (formSubmit)="onSubmit($event)">
  </app-form-generator>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancelar</button>
</mat-dialog-actions>
