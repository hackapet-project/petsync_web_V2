<h2 mat-dialog-title>Nueva Adopción</h2>
<mat-dialog-content>
    <app-form-generator
        [config]="adoptionConfig"
        (formSubmit)="onSubmit($event)">
      ></app-form-generator>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button mat-dialog-close>Cancelar</button>
</mat-dialog-actions>
