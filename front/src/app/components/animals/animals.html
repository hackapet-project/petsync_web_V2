<section>
  <!-- <h1>Hola?</h1> -->
   <header>
      <div>
        <mat-icon fontSet="material-symbols-outlined">search</mat-icon>
        <input type="text" placeholder="Buscar por nombre o raza">
      </div>
      <nav>
        <select type="text">
          <option value="" disabled>Raza</option>
          <option value="dog">Perro</option>
          <option value="cat">Gato</option>
          <option value="other">Otro</option>
        </select>
        <select type="text" placeholder="Edad">
          <option value="" disabled selected>Edad</option>
          <option value="dog">Joven (> 1 Año)</option>
          <option value="cat">Gato</option>
          <option value="other">Otro</option>
        </select>
        <select type="text" placeholder="Estado">
          <option value="" disabled selected>Estado</option>
          <option value="adopted">Adoptado</option>
          <option value="available">Disponible</option>
          <option value="other">Otro</option>
        </select>
        <button type="button" (click)="openCreateAnimalModal()">
          <mat-icon fontSet="material-symbols-outlined">add_2</mat-icon>
          Animal
        </button>
      </nav>
   </header>

   <div>
    @if (loading()) {
      <p>Cargando animales...</p>
    } @else if (error()) {
      <p>{{ error() }}</p>
    } @else {
      @for (animal of animals(); track animal.id) {
        <animal-widget [animal]="animal"/>
      } @empty {
        <p>No hay animales registrados.</p>
      }
    }
   </div>
</section>
